name: post
on:
  schedule: [{ cron: '*/20 * * * *' }]
  workflow_dispatch:
    inputs: { selftest: { type: boolean, default: false } }
concurrency: { group: post, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: python3 -c 'import PIL' 2>/dev/null || pip install -q pillow; which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - run: git config user.name poster && git config user.email poster@users.noreply.github.com
      - run: node post.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_POSTER_KEY: ${{ secrets.IG_POSTER_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SELFTEST: ${{ inputs.selftest && '1' || '' }}
      - run: |
          git add state.enc
          git diff --cached --quiet || { git commit -qm state; for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done; }
